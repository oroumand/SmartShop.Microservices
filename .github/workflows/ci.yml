name: ci

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore SmartShop.sln
      - name: Build
        run: dotnet build SmartShop.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test SmartShop.sln --configuration Release --no-build
      - name: Validate Compose
        run: docker compose config --quiet
